<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GitHub Finder - Developer Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    },
                    colors: {
                        gh: {
                            bg: '#0D1117',
                            card: '#161B22',
                            border: '#30363D',
                            text: '#E6EDF3',
                            muted: '#848D97',
                            accent: '#2EA043',
                            accentHover: '#2C974B',
                            focus: '#58A6FF',
                            skeleton: '#21262D'
                        }
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-gh-bg text-gh-text font-sans antialiased min-h-screen flex flex-col items-center pt-12 pb-24 px-4 sm:px-6 lg:px-8 selection:bg-gh-focus selection:text-white">

    <!-- App Container -->
    <main class="w-full max-w-5xl flex flex-col gap-8">
        
        <!-- HEADER & SEARCH SECTION -->
        <header class="flex flex-col gap-4">
            <div class="flex items-center gap-3">
                <svg class="w-8 h-8 text-gh-text" fill="currentColor" viewBox="0 0 24 24" aria-hidden="true"><path fill-rule="evenodd" d="M12 2C6.477 2 2 6.484 2 12.017c0 4.425 2.865 8.18 6.839 9.504.5.092.682-.217.682-.483 0-.237-.008-.868-.013-1.703-2.782.605-3.369-1.343-3.369-1.343-.454-1.158-1.11-1.466-1.11-1.466-.908-.62.069-.608.069-.608 1.003.07 1.531 1.032 1.531 1.032.892 1.53 2.341 1.088 2.91.832.092-.647.35-1.088.636-1.338-2.22-.253-4.555-1.113-4.555-4.951 0-1.093.39-1.988 1.029-2.688-.103-.253-.446-1.272.098-2.65 0 0 .84-.27 2.75 1.026A9.564 9.564 0 0112 6.844c.85.004 1.705.115 2.504.337 1.909-1.296 2.747-1.027 2.747-1.027.546 1.379.202 2.398.1 2.651.64.7 1.028 1.595 1.028 2.688 0 3.848-2.339 4.695-4.566 4.943.359.309.678.92.678 1.855 0 1.338-.012 2.419-.012 2.747 0 .268.18.58.688.482A10.019 10.019 0 0022 12.017C22 6.484 17.522 2 12 2z" clip-rule="evenodd"></path></svg>
                <h1 class="text-2xl font-bold tracking-tight">DevFinder</h1>
            </div>

            <!-- Search Form Wrapper -->
            <div class="relative w-full">
                <form class="search-form relative flex items-center w-full shadow-sm">
                    <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
                        <svg class="w-5 h-5 text-gh-muted" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
                    </div>
                    <input type="text" class="search-input w-full bg-gh-bg border border-gh-border rounded-xl py-4 pl-12 pr-32 text-gh-text placeholder-gh-muted focus:outline-none focus:border-gh-focus focus:ring-1 focus:ring-gh-focus transition-all duration-200" placeholder="Search GitHub username..." autocomplete="off">
                    <button type="submit" class="absolute right-2 top-2 bottom-2 bg-gh-focus hover:bg-blue-500 text-white font-medium rounded-lg px-6 transition-colors duration-200">
                        Search
                    </button>
                </form>
                
                <!-- Rate Limit Indicator -->
                <div class="absolute -bottom-6 right-1 text-[11px] font-semibold tracking-wider uppercase text-gh-muted flex items-center gap-1.5">
                    <span class="w-1.5 h-1.5 rounded-full bg-gh-accent"></span>
                    <span id="rate-limit-text"></span>
                </div>
            </div>

            <!-- Recent Searches -->
            <div class="recent-searches-container flex items-center gap-3 mt-4 overflow-x-auto pb-2 scrollbar-hide">
                <span class="text-xs text-gh-muted font-medium uppercase tracking-wider">Recent:</span>
                <button class="recent-search-tag whitespace-nowrap px-3 py-1.5 rounded-full bg-gh-card border border-gh-border text-sm text-gh-text hover:border-gh-muted transition-colors">torvalds</button>
            </div>
        </header>
        
        <!-- 1. INITIAL STATE -->
        <div class="initial-state flex flex-col items-center justify-center py-32 text-center">
            <div class="w-20 h-20 bg-gh-card border border-gh-border rounded-full flex items-center justify-center mb-6 shadow-lg">
                <svg class="w-10 h-10 text-gh-muted" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M10 20l4-16m4 4l4 4-4 4M6 16l-4-4 4-4"></path></svg>
            </div>
            <h2 class="text-2xl font-semibold text-gh-text mb-2">Search to explore</h2>
            <p class="text-gh-muted max-w-md mx-auto">Enter a GitHub username above to instantly view their profile, statistics, and top repositories.</p>
        </div>

        <!-- 2. LOADING STATE (Skeleton) -->
        <div class="loading-state flex animate-pulse flex-col md:flex-row gap-6 w-full">
            <!-- Profile Skeleton -->
            <div class="md:w-1/3 bg-gh-card border border-gh-border rounded-2xl p-6 flex flex-col gap-6">
                <div class="flex items-center gap-4">
                    <div class="w-20 h-20 rounded-full bg-gh-skeleton"></div>
                    <div class="flex-1 space-y-3">
                        <div class="h-5 bg-gh-skeleton rounded w-3/4"></div>
                        <div class="h-4 bg-gh-skeleton rounded w-1/2"></div>
                    </div>
                </div>
                <div class="space-y-2 mt-4">
                    <div class="h-4 bg-gh-skeleton rounded w-full"></div>
                    <div class="h-4 bg-gh-skeleton rounded w-5/6"></div>
                </div>
                <div class="h-10 bg-gh-skeleton rounded-lg w-full mt-4"></div>
            </div>
            <!-- Content Skeleton -->
            <div class="md:w-2/3 flex flex-col gap-6">
                <div class="grid grid-cols-3 gap-4">
                    <div class="h-24 bg-gh-card border border-gh-border rounded-2xl"></div>
                    <div class="h-24 bg-gh-card border border-gh-border rounded-2xl"></div>
                    <div class="h-24 bg-gh-card border border-gh-border rounded-2xl"></div>
                </div>
                <div class="space-y-4 mt-2">
                    <div class="h-32 bg-gh-card border border-gh-border rounded-2xl"></div>
                    <div class="h-32 bg-gh-card border border-gh-border rounded-2xl"></div>
                </div>
            </div>
        </div>

        <div class="error-state flex w-full bg-[#FFEBE9]/5 border border-[#FF8182]/40 rounded-2xl p-6 items-start gap-4 shadow-sm">
            <svg class="w-6 h-6 text-[#FF7B72] flex-shrink-0 mt-0.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"></path></svg>
            <div>
                <h3 class="text-lg font-semibold text-[#FF7B72]">User not found</h3>
                <p class="text-gh-muted mt-1 text-sm">We couldn't find a GitHub user matching that username. Please check the spelling and try again.</p>
            </div>
        </div>
        
        <div class="profile-data-container flex flex-col md:flex-row gap-6 lg:gap-8 w-full items-start">
        </div>
    </main>

</body>
<script src="script.js"></script>
</html>
